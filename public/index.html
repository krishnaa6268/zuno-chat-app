<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuno Chat | Real-time Messaging</title>
  </head>
  <body>
    <h1>Welcome to Zuno Chat!</h1>
    <p>Experience real-time messaging with our chat application.</p>

    <input type="text" id="messageInput"
      placeholder="Type your message here..." />
    <button id="sendButton">Send</button>

    <ul id="messages"></ul>

    <!-- "const io = new Server(server)" automatically serves the Socket.IO client library at "/socket.io/socket.io.js" from your backend server. -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const messagesList = document.getElementById("messages");

      socket.on("message", (message) => {
        const p = document.createElement("p");
        p.innerHTML = message;
        messagesList.appendChild(p);
      });

      // send message to server when button is clicked
      sendButton.addEventListener("click",()=>{
        const message = messageInput.value;
        console.log("Sending message from", socket.id, ":", message);

        if (message.trim() !== "") {
          socket.emit("chat-message", message);
          messageInput.value = "";
        }
      })

    </script>
  </body>
</html>

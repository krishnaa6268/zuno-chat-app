<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b5ce2" />
    <title>Zuno Chat | Private messaging</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <section id="identityScreen" class="overlay"
      aria-label="Choose your username">
      <form id="identityForm" class="card"><h2>Welcome to Zuno</h2><p>Choose the
          name your chat partner will see.</p><input id="usernameInput"
          maxlength="30" autocomplete="nickname" placeholder="Your username"
          required><button type="submit">Continue</button><p id="identityError"
          class="form-error" role="alert"></p></form>
    </section>
    <section id="roomScreen" class="overlay" hidden
      aria-label="Private room options">
      <div class="card"><h2>Private chat room</h2><p>Create a room and share its
          link with one person, or enter the room ID you received.</p><button
          id="createRoomButton" type="button">Create private room</button><div
          class="divider">or</div><form id="roomForm" class="join-row"><input
            id="roomInput" maxlength="8" autocomplete="off"
            placeholder="Room ID" required><button
            type="submit">Join</button></form><p id="roomError"
          class="form-error" role="alert"></p></div>
    </section>
    <main class="chat-app" aria-label="Zuno private chat">
      <header class="chat-header"><div class="avatar"
          aria-hidden="true">Z</div><div><h1>Zuno Chat</h1><p><span>●</span>
            Private room <strong id="roomCode">—</strong></p></div><div
          class="header-actions"><button id="shareRoomButton" type="button"
            hidden>Copy invite</button><button id="endRoomButton" type="button"
            hidden>End room</button><button id="leaveRoomButton" type="button"
            hidden>Leave room</button><button id="clearButton"
            type="button">Clear my chat</button></div></header>
      <ul id="messages" class="messages" aria-live="polite"
        aria-label="Messages"></ul>
      <form id="messageForm" class="composer"><div class="emoji-wrap"><button
            id="emojiButton" class="emoji-button" type="button"
            aria-label="Add emoji" aria-expanded="false">😊</button><div
            id="emojiPicker" class="emoji-picker" hidden
            aria-label="Emoji picker"></div></div><input id="messageInput"
          type="text" maxlength="2000" autocomplete="off"
          placeholder="Write a message..." aria-label="Message" disabled><button
          id="sendButton" type="submit" disabled>Send</button></form>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
